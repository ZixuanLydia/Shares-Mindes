    <section class="garden-panel history-panel" id="history-panel" aria-labelledby="history-title" hidden>
      <div class="panel-heading">
        <h2 class="panel-title" id="history-title" tabindex="-1">Garden history</h2>
        <button class="panel-close" id="history-close" type="button" aria-label="Close garden history">×</button>
      </div>
      <div class="history-views" role="tablist" aria-label="Garden history views">
        <button id="history-my" type="button" role="tab" aria-controls="history-list" aria-selected="true">My Flowers</button>
        <button id="history-timeline" type="button" role="tab" aria-controls="history-list" aria-selected="false" tabindex="-1">Timeline</button>
      </div>
      <p class="history-count" id="history-count" hidden></p>
      <p class="panel-help history-empty" id="history-empty" hidden>Your planted flowers will appear here.</p>
      <div class="history-list" id="history-list" role="tabpanel" aria-labelledby="history-my"></div>
    </section>
