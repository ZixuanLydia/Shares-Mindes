    <section class="garden-panel plant-panel" id="plant-panel" aria-labelledby="plant-title" hidden>
      <div class="panel-heading">
        <h2 class="panel-title" id="plant-title" tabindex="-1">Plant a Thought</h2>
        <div class="panel-controls">
          <button class="panel-back" id="plant-back" type="button" hidden>
            <span aria-hidden="true">‹</span> Back
          </button>
          <button class="panel-close" id="plant-close" type="button" aria-label="Close planting panel">×</button>
        </div>
      </div>

      <div class="plant-step" id="thought-step" hidden>
        <form class="thought-form" id="thought-form">
          <label class="panel-label" for="thought-input">What’s on your mind?</label>
          <textarea id="thought-input" name="thought" maxlength="180" rows="3" placeholder="A thought, a memory, a feeling…" required></textarea>
          <div class="nickname-field">
            <label class="panel-label" for="nickname-input">Nickname <span class="nickname-optional">(optional)</span></label>
            <input id="nickname-input" name="nickname" type="text" maxlength="32" autocomplete="nickname" placeholder="Local gardener">
          </div>
          <button class="panel-action" type="submit">Next</button>
        </form>
      </div>

      <div class="plant-step" id="style-step" hidden>
        <h3 class="step-title" tabindex="-1">Choose your flower</h3>
        <div class="association-group">
          <h4 class="panel-label">Preset associations</h4>
          <ul class="association-list" id="association-list"></ul>
        </div>
        <fieldset class="plant-fieldset">
          <legend class="panel-label">Flower shape</legend>
          <div class="plant-options">
            <label class="plant-option">
              <input type="radio" name="flower-form" value="cup" checked>
              <span class="choice-label">Cup</span>
            </label>
            <label class="plant-option">
              <input type="radio" name="flower-form" value="flared">
              <span class="choice-label">Flared</span>
            </label>
            <label class="plant-option">
              <input type="radio" name="flower-form" value="tall">
              <span class="choice-label">Tall</span>
            </label>
          </div>
        </fieldset>
        <fieldset class="plant-fieldset">
          <legend class="panel-label">Color</legend>
          <div class="plant-options">
            <label class="plant-option">
              <input type="radio" name="flower-color" value="peach" checked>
              <span class="choice-label"><span class="color-swatch peach-swatch" aria-hidden="true"></span>Peach</span>
            </label>
            <label class="plant-option">
              <input type="radio" name="flower-color" value="lilac">
              <span class="choice-label"><span class="color-swatch lilac-swatch" aria-hidden="true"></span>Lilac</span>
            </label>
            <label class="plant-option">
              <input type="radio" name="flower-color" value="blue">
              <span class="choice-label"><span class="color-swatch blue-swatch" aria-hidden="true"></span>Ice blue</span>
            </label>
          </div>
        </fieldset>
        <button class="panel-action" id="style-next" type="button">Grow flower</button>
      </div>

      <div class="plant-step" id="grow-step" hidden>
        <h3 class="step-title" tabindex="-1">Grow your flower</h3>
        <p class="panel-help" id="grow-instructions">Drag the flower upward or use this slider to open your flower.</p>
        <div class="grow-labels">
          <label class="panel-label" for="grow-range">Your flower’s bloom</label>
          <output id="grow-progress" for="grow-range" aria-hidden="true">0%</output>
        </div>
        <input class="range grow-range" id="grow-range" type="range" min="0" max="100" step="1" value="0" aria-valuetext="0%, bud" aria-describedby="grow-instructions">
        <div class="plant-commit">
          <p class="plant-stage-summary" id="plant-stage-summary">Plant as a bud</p>
          <button class="panel-action" id="plant-confirm" type="button" aria-describedby="plant-stage-summary">Plant in Garden</button>
        </div>
      </div>
    </section>

    <section class="garden-panel flower-detail" id="flower-detail" aria-labelledby="detail-title" hidden>
      <div class="panel-heading">
        <h2 class="panel-title" id="detail-title" tabindex="-1" aria-keyshortcuts="ArrowUp">Flower details</h2>
        <div class="panel-controls">
          <button class="panel-back" id="detail-back" type="button" aria-label="Back to garden history" hidden>
            <span aria-hidden="true">‹</span> Back
          </button>
          <button class="panel-close" id="detail-close" type="button" aria-label="Close flower details">×</button>
        </div>
      </div>
      <p class="panel-help detail-grow-hint" id="detail-grow-hint" hidden>Drag this flower upward to grow it. Release to save.</p>
      <p class="flower-thought" id="detail-thought"></p>
      <dl class="flower-fields" id="detail-fields"></dl>
      <button class="panel-action" id="detail-replay" type="button" aria-controls="focus-view">Replay growth</button>
      <p class="panel-help detail-growth" id="detail-growth"></p>
    </section>

    <p class="garden-status" id="garden-status" role="status" aria-atomic="true"></p>
